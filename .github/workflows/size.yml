name: Size

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  size:
    name: Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Size
        run: npm run size
