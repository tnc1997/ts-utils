name: Compatibility

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-node-${{ matrix.node }}
          path: |
            packages/array/package.json
            packages/array/dist
            packages/map/package.json
            packages/map/dist
    strategy:
      matrix:
        # Keep in sync with `build` in the matrix of the compatibility job.
        node: [ '22', '24', '26' ]

  compatibility:
    name: Compatibility
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-node-${{ matrix.build }}
          path: packages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Require @ts-utils/${{ matrix.package }} built on Node ${{ matrix.build }}
        run: node packages/${{ matrix.package }}/compatibility.js
    strategy:
      matrix:
        # The Node versions that the packages are built on, which must match
        # `node` in the matrix of the build job.
        build: [ '22', '24', '26' ]
        node: [ '18', '20', '22', '24', '26' ]
        package: [ 'array', 'map' ]
